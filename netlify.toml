[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# استثنِ دوال الخادم من إعادة التوجيه حتى لا تُلتقط وتُرجَع كصفحة HTML
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
